services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: subledger
      POSTGRES_USER: subledger
      POSTGRES_PASSWORD: subledger_dev_password
    ports: ["5434:5432"]
    volumes: [subledger_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U subledger -d subledger"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://subledger:subledger_dev_password@db:5432/subledger
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  subledger_data:
